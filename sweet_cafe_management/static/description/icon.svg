<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Cake icon shape (simplified) -->
  <!-- Cake base -->
  <rect x="45" y="120" width="110" height="40" rx="8" fill="#FFF8DC"/>
  <!-- Cake middle layer -->
  <rect x="55" y="90" width="90" height="35" rx="6" fill="#FFFACD"/>
  <!-- Cake top layer -->
  <rect x="65" y="65" width="70" height="30" rx="5" fill="#FFF5E6"/>
  <!-- Candles -->
  <rect x="80" y="48" width="8" height="20" rx="3" fill="#FF6B6B"/>
  <rect x="96" y="44" width="8" height="24" rx="3" fill="#4ECDC4"/>
  <rect x="112" y="48" width="8" height="20" rx="3" fill="#FFE66D"/>
  <!-- Flames -->
  <ellipse cx="84" cy="46" rx="4" ry="6" fill="#FFA500"/>
  <ellipse cx="100" cy="42" rx="4" ry="6" fill="#FFA500"/>
  <ellipse cx="116" cy="46" rx="4" ry="6" fill="#FFA500"/>
  <!-- Text: SC -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#8B4513">SC</text>
</svg>
